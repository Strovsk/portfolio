<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" style="background: #eee;">
  <title>Background Tech Card Accent</title>

  <style>
    .main_arc {
      transform-origin: 250px 250px;
      transition: 1s ease-in all;
      animation: path_arc 20s ease-in infinite alternate, path_opacity 20s ease-in infinite alternate;
      stroke: #808080;
    }

    #me {
      background-image: url(me.png);
      fill: none;

    }

    @keyframes path_arc {
      to {
        transform: rotate(350deg);
      }
    }

    @keyframes path_opacity {
      to {
        opacity: 0%;
      }
    }
  </style>

  <!-- <circle cx="250" cy="250" r="5" fill="red" /> -->
  <!-- <circle cx="250" cy="250" r="250" fill="none" stroke="red" /> -->
  <!-- <rect x="0" y="0" width="500" height="500" stroke="red" fill="none" /> -->

  <!-- <path d="M 125 75 A 10 10 0 0 0 375 325" fill="none" stroke="#1b1b1b" class="main_arc" style="animation-delay: 2s;" /> -->

  <circle cx="250" cy="250" r="100" fill="none" stroke="#1b1b1b" />
  <circle cx="250" cy="250" r="75" id="me" />

  <!-- <image href="me.png" height="200" width="200" /> -->
  <path d="M 100 100 A 2.5 2.5 0 0 0 400 400" fill="none" class="main_arc" style="animation-delay: 0s; animation-direction: alternate;" />
  <path d="M 125 125 A 2.5 2.5 0 0 0 375 375" fill="none" class="main_arc" style="animation-delay: 2s; animation-direction: alternate-reverse;" />
  <path d="M 150 150 A 2.5 2.5 0 0 0 350 350" fill="none" class="main_arc" style="animation-delay: 4s; animation-direction: alternate;" />
  <path d="M 200 200 A 2.5 2.5 0 0 0 300 300" fill="none" class="main_arc" style="animation-delay: 6s; animation-direction: alternate-reverse;" />
</svg>
